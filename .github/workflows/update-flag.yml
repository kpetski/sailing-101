name: Update Flag Status

on:
  schedule:
    # Every 10 min, roughly 6am-7pm Central (the club's own sailing hours) —
    # 11:00-23:59 UTC. Public repo, so Actions minutes are free either way.
    # Cron is fixed UTC, so this drifts an hour with DST; not worth the
    # complexity to correct for a hobby study app.
    - cron: "*/10 11-23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-flag.mjs
      - run: |
          if ! git diff --quiet -- public/flag-status.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/flag-status.json
            git commit -m "Update flag status snapshot"
            git push
            # A push made with the default GITHUB_TOKEN doesn't trigger other
            # workflows' `on: push` (GitHub's anti-recursion rule), so
            # deploy.yml would never rebuild the live site on its own —
            # kick it off explicitly instead.
            gh workflow run deploy.yml --ref main
          else
            echo "No change in flag status"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
